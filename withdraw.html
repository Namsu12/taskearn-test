<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Withdraw - Task Earn</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="withdraw.css" />
</head>
<body>

    <div class="withdraw-container">

        <!-- ========== TOP BAR ========== -->
        <header class="top-bar">
            <a href="wallet.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="brand">
                <i class="fas fa-microchip"></i>
                <span>Task Earn</span>
            </div>
            <div class="top-actions">
                <img src="https://ui-avatars.com/api/?name=Task Earn+User&background=00d4ff&color=fff&size=36" alt="User" id="userAvatarImg" />
            </div>
        </header>

        <!-- ========== PAGE TITLE ========== -->
        <div class="page-header">
            <h1><i class="fas fa-hand-holding-usd"></i> Withdraw Funds</h1>
            <p>Withdraw your earnings to your wallet</p>
        </div>

        <!-- ========== BALANCE CARD ========== -->
        <div class="balance-card">
            <span class="balance-label"><i class="fas fa-wallet"></i> Available Balance</span>
            <span class="balance-amount" id="withdrawBalanceAmount">0.00</span>
            <span class="balance-sub">Min withdrawal: ₦2000</span>
        </div>

        <!-- ========== WITHDRAW FORM ========== -->
        <div class="withdraw-form">

            <!-- Method Selection -->
            <div class="form-group">
                <label><i class="fas fa-credit-card"></i> Withdrawal Method</label>
                <div class="method-selector">
                    <button class="method-btn active" data-method="bank">
                        <i class="fas fa-university"></i> Bank Transfer
                    </button>
                    <button class="method-btn" data-method="crypto">
                        <i class="fab fa-bitcoin"></i> Cryptocurrency
                    </button>
                    <button class="method-btn" data-method="mobile">
                        <i class="fas fa-mobile-alt"></i> Mobile Money
                    </button>
                </div>
            </div>

            <!-- Amount Input -->
            <div class="form-group">
                <label><i class="fas fa-dollar-sign"></i> Amount (USD)</label>
                <div class="amount-input-wrapper">
                    <span class="currency-symbol">₦</span>
                    <input type="number" id="amountInput" placeholder="Enter amount" min="50" step="1" />
                </div>
                <div class="amount-hint">
                    <span>Min: ₦2000</span>
                    <span>Max: ₦250000</span>
                    <span>Available: ₦<span id="withdrawAvailableHint">0</span></span>
                </div>
            </div>

            <!-- Quick Amount Buttons -->
            <div class="quick-amounts">
                <button class="quick-btn" data-amount="3500">₦3500</button>
                <button class="quick-btn" data-amount="5000">₦5000</button>
                <button class="quick-btn" data-amount="20000">₦20000</button>
                <button class="quick-btn" data-amount="100000">₦100000</button>
            </div>

            <!-- Bank Details -->
            <div class="bank-details" id="bankDetails">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Account Holder Name</label>
                    <input type="text" id="accountHolder" placeholder="Enter full name" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-university"></i> Bank Name</label>
                    <input type="text" id="bankName" placeholder="Enter bank name" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-hashtag"></i> Account Number</label>
                    <input type="text" id="accountNumber" placeholder="Enter account number" />
                </div>
            </div>

            <!-- Crypto Details -->
            <div class="bank-details hidden" id="cryptoDetails">
                <div class="form-group">
                    <label><i class="fas fa-coins"></i> Cryptocurrency</label>
                    <select id="cryptoSelect">
                        <option value="USDT">USDT (TRC20)</option>
                        <option value="BTC">Bitcoin (BTC)</option>
                        <option value="ETH">Ethereum (ETH)</option>
                        <option value="BNB">BNB (BEP20)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-qrcode"></i> Wallet Address</label>
                    <input type="text" id="walletAddress" placeholder="Enter crypto wallet address" />
                </div>
            </div>

            <!-- Mobile Money Details -->
            <div class="bank-details hidden" id="mobileDetails">
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="mobileNumber" placeholder="Enter phone number" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-building"></i> Provider</label>
                    <select id="mobileProvider">
                        <option value="">Select provider</option>
                        <option value="MTN">MTN</option>
                        <option value="Airtel">Airtel</option>
                        <option value="Glo">Glo</option>
                        <option value="9mobile">9mobile</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <button class="submit-btn" id="submitWithdrawBtn">
                <i class="fas fa-paper-plane"></i> Submit Withdrawal
            </button>

        </div>

        <!-- ========== RECENT WITHDRAWALS ========== -->
        <div class="recent-section">
            <h3><i class="fas fa-history"></i> Recent Withdrawals</h3>
            <div id="recentWithdrawalsList">
                <div class="recent-empty">
                    <i class="fas fa-inbox"></i>
                    <p>No withdrawals yet</p>
                    <span>Your withdrawal history will appear here</span>
                </div>
            </div>
        </div>

        <!-- ========== BOTTOM NAV ========== -->
        <nav class="bottom-nav">
            <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
            <a href="plans.html"><i class="fas fa-box"></i> Plans</a>
            <a href="tasks.html"><i class="fas fa-gift"></i> Tasks</a>
            <a href="wallet.html"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
        </nav>

    </div>

    <!-- ========== TOAST ========== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Withdrawal submitted!</span>
    </div>

    <script src="withdraw.js" type="module"></script>
</body>
</html>
