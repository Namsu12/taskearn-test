<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Investment Plans - Task Earn</title>
    <!-- Preconnects-->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="cdnjs.cloudflare.com" crossorigin>
    
    <!-- Descriptions -->
    <meta name="author" content="TaskEarn">
    <meta name="description" content="Explore Task Earn investment plans, review available options, investment terms, durations, and potential returns before choosing a plan that suits your goals.">
    
    <!--SEO instruction-->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Icons, stylesheets, fonts/libraries-->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="plans.css" />
    
    <!-- Mainfest -->
    <link rel="manifest" href="site.webmanifest">
    
    <!-- Misc-Theme color -->
    <meta name="theme-color" content="#0b0e1a">
    
    <!-- Open Graphs -->
    <meta property="og:title" content="Plans - Task Earn">
    <meta property="og:description" content="Explore Task Earn investment plans, review available options, investment terms, durations, and potential returns before choosing a plan that suits your goals.">
    <meta property="og:image" content="https://taskearn.pages.dev/android-chrome-512x512.png">
    <meta property="og:url" content="https://taskearn.pages.dev/plans.html">
    <meta property="og:type" content="website">
    
    <!-- Twiter(x) Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Plans - Task Earn">
    <meta name="twitter:description" content="Explore Task Earn investment plans, review available options, investment terms, durations, and potential returns before choosing a plan that suits your goals.">
    <meta name="twitter:image" content="https://taskearn.pages.dev/android-chrome-512x512.png">
    
</head>
<body>
    <div class="plans-container">

        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="brand">
                <i class="fas fa-microchip"></i>
                <span>Task Earn</span>
            </div>
            <div class="top-actions">
                <span class="balance"><i class="fas fa-wallet"></i> <span id="topBalance">0</span></span>
                <img src="https://ui-avatars.com/api/?name=User&background=00d4ff&color=fff&size=36" alt="User" id="userAvatarImg" />
            </div>
        </header>

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1><i class="fas fa-chart-line"></i> Investment Plans</h1>
            <p>Choose a plan and start earning daily</p>
        </div>

        <!-- DISCLAIMER -->
        <div class="disclaimer-banner">
            <i class="fas fa-triangle-exclamation"></i>
            <p>Deposit first before investing. Your balance must cover the plan price. Daily earnings are claimable every 24 hours from your dashboard.</p>
        </div>

        <!-- PLANS GRID (loaded from Firestore) -->
        <section class="plan-section">
            <h2 class="section-title"><i class="fas fa-box"></i> Available Plans</h2>
            <div id="plansGrid" class="plans-grid">
                <div style="color:#8892b0;text-align:center;padding:40px;grid-column:1/-1;">
                    <i class="fas fa-spinner fa-spin" style="font-size:24px;margin-bottom:10px;display:block;"></i>
                    Loading plans...
                </div>
            </div>
        </section>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
            <a href="plans.html" class="active"><i class="fas fa-box"></i> Plans</a>
            <a href="tasks.html"><i class="fas fa-gift"></i> Tasks</a>
            <a href="wallet.html"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
        </nav>

    </div>
    <script src="plans.js" type="module"></script>
</body>
</html>
