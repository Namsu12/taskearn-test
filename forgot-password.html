<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Reset Password - Task Earn</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="footer.css" />
</head>
<body>

    <div class="login-card">
        <div class="brand">
            <i class="fas fa-microchip"></i>
            <h1>Task Earn</h1>
        </div>

        <div class="welcome-text">
            <h2>Reset Password</h2>
            <p><i class="fas fa-key"></i> Enter your email and we'll send a reset link</p>
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
            </div>

            <button type="submit" class="btn-login" id="resetBtn">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>

        <div class="reset-note" id="resetNote" style="display:none;">
            <i class="fas fa-circle-check"></i>
            <p>If an account exists for that email, a reset link is on its way. Check your inbox — <strong>and your spam/junk folder too</strong>, since automated emails sometimes land there.</p>
        </div>

        <div class="register-row">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <!-- ========== TOAST ========== -->
    <div class="toast-message" id="toastMessage">
        <i class="fas fa-check-circle"></i>
        <span id="toastText">Reset link sent!</span>
    </div>

    <script src="forgot-password.js" type="module"></script>
    <script src="footer.js"></script>
</body>
</html>
