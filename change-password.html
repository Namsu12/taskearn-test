<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Change Password - Task Earn</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="change-password.css" />
</head>
<body>

    <div class="change-password-container">

        <!-- ========== TOP BAR ========== -->
        <header class="top-bar">
            <a href="profile.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="brand">
                <i class="fas fa-microchip"></i>
                <span>Task Earn</span>
            </div>
            <div class="top-actions">
                <img src="https://ui-avatars.com/api/?name=Task Earn+User&background=00d4ff&color=fff&size=36" alt="User" id="userAvatarImg" />
            </div>
        </header>

        <!-- ========== PAGE HEADER ========== -->
        <div class="page-header">
            <h1><i class="fas fa-lock"></i> Change Password</h1>
            <p>Choose a strong, new password</p>
        </div>

        <!-- ========== FORM ========== -->
        <form class="change-form" id="changePasswordForm">

            <div class="form-group">
                <label for="currentPassword"><i class="fas fa-key"></i> Current Password</label>
                <div class="input-wrapper">
                    <input type="password" id="currentPassword" placeholder="••••••••" required />
                    <button type="button" class="toggle-password" data-target="currentPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" placeholder="••••••••" minlength="6" required />
                    <button type="button" class="toggle-password" data-target="newPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="field-hint">Minimum 6 characters.</div>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword"><i class="fas fa-lock"></i> Confirm New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmNewPassword" placeholder="••••••••" required />
                    <button type="button" class="toggle-password" data-target="confirmNewPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-save" id="savePasswordBtn">
                <i class="fas fa-check-circle"></i> Update Password
            </button>

            <a href="profile.html" class="btn-cancel">Cancel</a>

        </form>

        <!-- ========== BOTTOM NAV ========== -->
        <nav class="bottom-nav">
            <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
            <a href="plans.html"><i class="fas fa-box"></i> Plans</a>
            <a href="wallet.html"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="profile.html" class="active"><i class="fas fa-user"></i> Profile</a>
        </nav>

        <!-- ========== TOAST ========== -->
        <div class="toast-message" id="toastMessage">
            <i class="fas fa-check-circle"></i>
            <span id="toastText">Saved!</span>
        </div>

    </div>

    <script src="change-password.js" type="module"></script>
</body>
</html>
