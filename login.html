<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Login - Task Earn</title>
    
    <!-- Preconnects-->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="cdnjs.cloudflare.com" crossorigin>

<!-- Descriptions -->
<meta name="author" content="TaskEarn">
<meta name="description" content="Log in to your Task Earn account to manage your investments, monitor your funds and earnings, view investment activity, and access available earning opportunities.">

<!-- Icons, stylesheets, fonts/libraries-->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="footer.css" />

<!-- Mainfest -->
<link rel="manifest" href="site.webmanifest">

<!-- Misc-Theme color -->
<meta name="theme-color" content="#0b0e1a">

<!-- Open Graphs -->
<meta property="og:title" content="Login - Task Earn">
<meta property="og:description" content="Log in to your Task Earn account to manage your investments, monitor your funds and earnings, view investment activity, and access available earning opportunities.">
<meta property="og:image" content="https://taskearn.pages.dev/android-chrome-512x512.png">
<meta property="og:url" content="https://taskearn.pages.dev/login.html">
<meta property="og:type" content="website">

<!-- Twiter(x) Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="login - Task Earn">
<meta name="twitter:description" content="Log in to your Task Earn account to manage your investments, monitor your funds and earnings, view investment activity, and access available earning opportunities.">
<meta name="twitter:image" content="https://taskearn.pages.dev/android-chrome-512x512.png">
   
</head>
<body>

    <div class="login-card">
        <div class="brand">
            <i class="fas fa-microchip"></i>
           <a href="landing.html" class="logo"><h1>Task Earn</h1></a> 
        </div>

        <div class="welcome-text">
            <h2>Hello,</h2>
            <p><i class="fas fa-rocket"></i> Welcome to Task Earn — Maximize the value of your assets</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Login Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required />
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="row-actions">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" /> Remember Account
                </label>
                <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="register-row">
            Don't have an account? <a href="register.html">Register New Account</a>
        </div>

        <div class="terms">
            <i class="fas fa-shield-alt"></i> First login will automatically create an account and represents agreement
            <a href="#">User Agreement</a> and
            <a href="#">Privacy Policy</a>
        </div>

        <div id="toastMessage" class="toast-message">
            <i class="fas fa-check-circle"></i>
            <span id="toastText">Login successful!</span>
        </div>
    </div>

    <script src="login.js" type="module"></script>
    <script src="footer.js"></script>
</body>
</html>
